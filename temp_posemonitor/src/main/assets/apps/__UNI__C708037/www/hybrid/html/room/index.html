<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>视频会议</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    <div id="loading-mask">加载中...</div>
    
    <!-- 房间控制区域 -->
    <div class="room-controls">
      <div id="room-join">
        <input id="room-input" type="text" placeholder="输入房间号" inputmode="numeric" pattern="[0-9]*" />
        <button id="join-btn" class="primary-btn">加入会议</button>
      </div>
      <button id="leave-btn" class="secondary-btn" style="display:none;">退出</button>
    </div>

    <!-- 房间列表区域 -->
    <div class="room-list-bg">
      <div class="room-list-header">
        小褐自习室
      </div>
      <div id="room-list-section" class="room-list-section">
        <!-- 房间卡片将通过JS动态添加 -->
      </div>
    </div>

    <!-- 视频网格区域 -->
    <div id="video-grid">
      <div class="video-slot" id="slot-0"></div>
      <div class="video-slot" id="slot-1"></div>
      <div class="video-slot" id="slot-2"></div>
      <div class="video-slot" id="slot-3"></div>
      <div class="video-slot" id="slot-4"></div>
      <div class="video-slot" id="slot-5"></div>
    </div>

    <!-- 全局控制按钮 -->
    <div id="global-controls">
      <button id="mute-all-mic" title="一键闭麦">🎤</button>
      <button id="unmute-all-mic" title="一键开麦">🔊</button>
      <button id="mute-all-speaker" title="一键关闭所有人声音">🔇</button>
      <button id="unmute-all-speaker" title="一键开启所有人声音">🔈</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
