<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room List</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
        }
        .blue-box {
            width: 1920px;
            height: 1080px;
            background: #2196f3;
            position: relative;
            overflow: hidden;
        }
        .gray-panel {
            width: 765.56px;
            height: 803.84px;
            position: absolute;
            top: 199px;
            background: #eaeaea;
            opacity: 1;
            border-radius: 38.28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 34.45px;
        }
        .gray-panel.left {
            left: 135px;
        }
        .gray-panel.right {
            left: 1019.56px;
        }
        .room-card {
            width: 765.56px;
            height: 244.98px;
            background: #fff;
            border-radius: 38.28px;
            opacity: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="blue-box">
        <div class="gray-panel left">
            <div class="room-card">卡片1</div>
            <div class="room-card">卡片2</div>
            <div class="room-card">卡片3</div>
        </div>
        <div class="gray-panel right">
            <div class="room-card">卡片4</div>
            <div class="room-card">卡片5</div>
            <div class="room-card">卡片6</div>
        </div>
    </div>
</body>
</html>
