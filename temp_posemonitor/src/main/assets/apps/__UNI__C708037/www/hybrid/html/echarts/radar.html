<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>雷达图</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #chart {
            width: 100%;
            height: 100%;
            background: transparent;
        }
    </style>
</head>

<body>
    <div id="chart"></div>
    <script>
        // 获取URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const data = JSON.parse(decodeURIComponent(urlParams.get('data')));
        const width = parseInt(urlParams.get('width')) || 280;
        const height = parseInt(urlParams.get('height')) || 280;

        // 设置容器大小
        document.getElementById('chart').style.width = width + 'px';
        document.getElementById('chart').style.height = height + 'px';

        // 初始化echarts实例
        const chart = echarts.init(document.getElementById('chart'), null, {
            width: width,
            height: height,
            devicePixelRatio: window.devicePixelRatio
        });

        // 配置项
        const option = {
            backgroundColor: 'transparent',
            grid: {
                top: 0,
                right: 0,
                bottom: 0,
                left: 0,
                containLabel: true
            },
            radar: {
                shape: 'polygon',
                center: ['50%', '50%'],
                radius: '70%',
                nameGap: 15,
                splitNumber: 4,
                axisName: {
                    formatter: (name) => {
                        const item = data.find(i => i.name === name);
                        return `{a|${name}}\n{b|${item.progress}}`;
                    },
                    rich: {
                        a: {
                            color: '#333333',
                            fontSize: 11,
                            padding: [0, 0, 5, 0]
                        },
                        b: {
                            color: '#333333',
                            fontSize: 12,
                            fontWeight: 'bold'
                        }
                    }
                },
                splitArea: {
                    areaStyle: {
                        color: [
                            'rgba(92, 255, 103, 0.3)',
                            'rgba(92, 255, 103, 0.2)',
                            'rgba(146, 222, 255, 0.15)',
                            'rgba(146, 222, 255, 0.1)'
                        ]
                    }
                },
                axisLine: {
                    lineStyle: {
                        color: '#4CD964'
                    }
                },
                splitLine: {
                    lineStyle: {
                        color: '#4CD964'
                    }
                },
                indicator: data.map(item => ({
                    name: item.name,
                    max: 100,
                    color: item.color
                }))
            },
            series: [{
                type: 'radar',
                symbolSize: 6,
                itemStyle: {
                    color: '#4CD964'
                },
                lineStyle: {
                    color: '#4CD964',
                    width: 2
                },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                        offset: 0,
                        color: 'rgba(92, 255, 103, 0.3)'
                    }, {
                        offset: 1,
                        color: 'rgba(92, 255, 103, 0.1)'
                    }])
                },
                data: [{
                    value: data.map(item => item.progress)
                }]
            }]
        };

        // 设置配置项并渲染图表
        chart.setOption(option);

        // 监听窗口大小变化，调整图表大小
        window.addEventListener('resize', () => {
            chart.resize();
        });
    </script>
</body>

</html>
