buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.8.22"
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://mvn.mob.com/android' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
        classpath("com.facebook.react:react-native-gradle-plugin:0.72.5")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.mob.sdk:MobSDK2:+")
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://mvn.mob.com/android' }
        google()
        mavenCentral()
    }

    // Force部分 AndroidX 依赖的版本，避免个别库自动升级到更高版本导致编译断崖式报错
    configurations.all { config ->
        resolutionStrategy {
            force "androidx.core:core:1.10.1"
            force "androidx.core:core-ktx:1.10.1"
            force "androidx.appcompat:appcompat:1.6.1"
            force "androidx.appcompat:appcompat-resources:1.6.1"
            force "androidx.annotation:annotation-experimental:1.3.1"
            // Use an older core-viewtree to avoid high compileSdk requirements
            force "androidx.core:core-viewtree:1.0.0-alpha02"

            // CameraX 版本交由各库自行管理（例如 VisionCamera），在 compileSdk 34 下不再强制降级
        }
    }
}

// Ensure all Android modules use a consistent SDK / Build Tools setup
subprojects { subproject ->
    afterEvaluate { project ->
        if (project.hasProperty("android") && project.android != null) {
            // Align compileSdk / buildTools across app and all libraries
            try {
                project.android.compileSdkVersion rootProject.ext.compileSdkVersion
            } catch (Throwable ignored) { }

            try {
                project.android.buildToolsVersion rootProject.ext.buildToolsVersion
            } catch (Throwable ignored) { }

            try {
                def defaultConfig = project.android.defaultConfig
                if (defaultConfig != null) {
                    defaultConfig.minSdkVersion rootProject.ext.minSdkVersion
                    defaultConfig.targetSdkVersion rootProject.ext.targetSdkVersion
                }
            } catch (Throwable ignored) { }

            // Use Java 17 across all Android modules so libraries like
            // react-native-reanimated 3.16.x can use modern language features
            try {
                project.android.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            } catch (Throwable ignored) { }
        }

        // Align Kotlin jvmTarget where Kotlin Android plugin is applied
        try {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
                if (task.kotlinOptions != null) {
                    task.kotlinOptions.jvmTarget = "17"
                }
            }
        } catch (Throwable ignored) { }
    }
}
