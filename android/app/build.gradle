    productFlavors {
        "prodgobet" {
            dimension "environment"
            applicationId "com.sambad.prodgobet"
            manifestPlaceholders = [
                appIcon: "@mipmap/ic_launcher_1"
            ]
            resValue "string", "app_name", "Gobet758"
            resValue "string", "env_config_path", ".env.prodgobet"
            buildConfigField "String", "CODE_PUSH_FILE_DIR", "\"prodgobet\""  // 目录名与flavor一致
            resValue "string", "code_push_hash_dir", "prodgobet"  // 资源目录隔离
            versionCode 1         // ← 独立 versionCode
            versionName "3.10.4"    // ← 独立 versionName
