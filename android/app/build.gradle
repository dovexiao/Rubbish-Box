dependencies {
    // *** adjust ***
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation(name: 'salesmartyplugin-release', ext: 'aar')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'

    implementation(name: 'Tasyee-sdk', ext: 'aar')
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.14.9'

    // implementation 'com.adjust.sdk:adjust-android:4.33.5'
    // implementation 'com.android.installreferrer:installreferrer:2.2'
    // // Add the following if you are using the Adjust SDK inside web views on your app
    // implementation 'com.adjust.sdk:adjust-android-webbridge:5.4.3'
    // implementation project(':react-native-adjust')
    // *** env config ***
    implementation project(':react-native-config')
    //moengage
    implementation("com.moengage:moe-android-sdk:12.10.00")
    implementation("com.moengage:inbox-core:2.6.0")
    implementation("com.moengage:geofence:3.4.0")
    implementation("com.moengage:cards-core:1.6.0")
    //google service ads
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    // firebase
    implementation platform('com.google.firebase:firebase-bom:30.3.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation('com.google.firebase:firebase-messaging:23.2.1')
    //androidx
    implementation("androidx.core:core:1.9.0")
    implementation("androidx.appcompat:appcompat:1.4.2")
    implementation("androidx.lifecycle:lifecycle-process:2.5.1")

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")


    implementation('com.facebook.fresco:webpsupport:2.5.0')
    // Optionally, to display animated WebP images, you have to add:
    implementation('com.facebook.fresco:animated-webp:2.5.0')
    implementation('com.facebook.fresco:animated-gif:2.5.0')

    //chat
    //freshchatSDK
    implementation 'com.github.freshworks:freshchat-android:6.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // paytm
    // implementation files('libs/easy-upi-payment-lib.aar')
    implementation 'dev.shreyaspatil.EasyUpiPayment:EasyUpiPayment:3.0.3'

    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }

    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
